[project]
name = "uscongress"
version = "0.1.0"
description = "ETL pipeline that mirrors the US Congress as git repositories"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
]

[project.scripts]
uscongress = "uscongress.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uscongress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
